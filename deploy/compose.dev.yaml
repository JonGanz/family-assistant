services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: fa
      POSTGRES_PASSWORD: fa
      POSTGRES_DB: fa
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - fa-dev-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fa -d fa"]
      interval: 5s
      timeout: 3s
      retries: 20

  ntfy:
    image: binwiederhier/ntfy:v2.17.0
    command: ["serve"]
    environment:
      NTFY_BASE_URL: http://127.0.0.1:18090
    ports:
      - "127.0.0.1:18090:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:80/v1/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  fa-dev-pgdata:
