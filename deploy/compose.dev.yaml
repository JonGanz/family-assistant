services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: fa
      POSTGRES_PASSWORD: fa
      POSTGRES_DB: fa
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - fa-dev-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fa -d fa"]
      interval: 5s
      timeout: 3s
      retries: 20

  ntfy:
    image: binwiederhier/ntfy:v2.17.0
    command: ["serve"]
    environment:
      NTFY_BASE_URL: http://127.0.0.1:18090
    ports:
      - "127.0.0.1:18090:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:80/v1/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Local mail server for trying the mail features without a real mailbox (never exposed beyond
  # this machine): IMAP on 13143, SMTP on 13025. Any login works (auth is off); mail sent by SMTP
  # to <address> shows up in the mailbox whose IMAP user name is <address>.
  greenmail:
    image: greenmail/standalone:2.1.8
    environment:
      GREENMAIL_OPTS: >-
        -Dgreenmail.setup.test.imap -Dgreenmail.setup.test.smtp
        -Dgreenmail.hostname=0.0.0.0 -Dgreenmail.auth.disabled
    ports:
      - "127.0.0.1:13143:3143"
      - "127.0.0.1:13025:3025"

volumes:
  fa-dev-pgdata:
