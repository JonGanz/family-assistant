<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Fictional Pumpkin Pasta</title></head>
<body>
<div itemscope itemtype="https://schema.org/Recipe">
  <h1 itemprop="name">Fictional Pumpkin Pasta</h1>
  <meta itemprop="recipeYield" content="3 servings">
  <meta itemprop="prepTime" content="PT10M">
  <meta itemprop="cookTime" content="PT20M">
  <ul>
    <li itemprop="recipeIngredient">250 g pasta</li>
    <li itemprop="recipeIngredient">1 cup pumpkin puree</li>
    <li itemprop="recipeIngredient">1 clove garlic</li>
    <li itemprop="recipeIngredient">2 tbsp butter</li>
  </ul>
  <div itemprop="recipeInstructions">Boil the pasta. Warm the puree with garlic and butter, then toss together.</div>
</div>
</body>
</html>
