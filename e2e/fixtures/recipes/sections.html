<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Fictional Glazed Drumsticks</title>
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "Recipe",
  "name": "Fictional Glazed Drumsticks",
  "recipeYield": "4 servings",
  "prepTime": "PT10M",
  "cookTime": "PT40M",
  "recipeIngredient": [
    "For the chicken:",
    "8 chicken drumsticks",
    "1 tbsp paprika",
    "For the glaze:",
    "3 tbsp honey",
    "2 tbsp soy sauce",
    "1 lime"
  ],
  "recipeInstructions": [
    {
      "@type": "HowToSection",
      "name": "Chicken",
      "itemListElement": [
        { "@type": "HowToStep", "text": "Rub the drumsticks with paprika and roast for 35 minutes." }
      ]
    },
    {
      "@type": "HowToSection",
      "name": "Glaze",
      "itemListElement": [
        { "@type": "HowToStep", "text": "Warm the honey and soy sauce until syrupy." }
      ]
    },
    { "@type": "HowToStep", "text": "Brush the glaze over the chicken and serve with lime." }
  ]
}
</script>
</head>
<body><h1>Fictional Glazed Drumsticks</h1></body>
