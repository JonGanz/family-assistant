name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: fa
          POSTGRES_PASSWORD: fa
          POSTGRES_DB: fa
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fa"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      # IMAP tests (tests marked #[ignore = "needs FA_TEST_GREENMAIL"]): a real IMAP server.
      greenmail:
        image: greenmail/standalone:2.1.8
        env:
          GREENMAIL_OPTS: >-
            -Dgreenmail.setup.test.imap -Dgreenmail.setup.test.imaps
            -Dgreenmail.hostname=0.0.0.0 -Dgreenmail.auth.disabled
        ports:
          - 3143:3143
          - 3993:3993
    env:
      # Runtime only: #[sqlx::test] creates a fresh DB per test and runs the migrations.
      DATABASE_URL: postgres://fa:fa@127.0.0.1:5432/fa
      # Compile-time query checks use the committed .sqlx/ data, never the (empty) service DB.
      SQLX_OFFLINE: "true"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Install toolchain from rust-toolchain.toml
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@2201cc584a476d1b508be977bbe4b7d1c7a52e9c # v2.9.3
      - uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: nextest
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo nextest run --workspace
      - name: GreenMail-gated IMAP tests
        env:
          FA_TEST_GREENMAIL: 127.0.0.1:3143:3993
        run: |
          for _ in $(seq 60); do
            (exec 3<>/dev/tcp/127.0.0.1/3143 && read -r -t 2 g <&3 && [[ $g == "* OK"* ]]) 2>/dev/null && break
            sleep 1
          done
          cargo nextest run -p fa-connectors -p fa-mail --run-ignored only -E 'binary(imap) | binary(sync_imap)'

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: python3 tools/fa.py check
      - run: python3 tools/test_fa.py
      - run: python3 tools/fa.py check-yaml .github/workflows/*.yml deploy/*.yaml

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: EmbarkStudios/cargo-deny-action@c3bbe7e4e3f7baeee1a3dd9aec0a3b2aded580fb # v2.1.1

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Enable corepack
        run: corepack enable
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      - run: corepack pnpm@9 install --frozen-lockfile
      - run: corepack pnpm@9 lint
      - run: corepack pnpm@9 typecheck
      - run: corepack pnpm@9 test
      - run: corepack pnpm@9 build

  hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: scripts/check-example-data.sh

  compose-smoke:
    # The install file as a user runs it: no .env, built from this checkout (scripts/compose-smoke.sh).
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: scripts/compose-smoke.sh
