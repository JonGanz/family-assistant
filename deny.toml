[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
# pin-utils 0.1.1 is flagged unmaintained (RUSTSEC-2026-0441; no vulnerability). It is a transitive
# dep of async-imap 0.12, which fa-connectors uses for IMAP. Revisit when async-imap drops it.
# ttf-parser 0.25.1 is flagged unmaintained (no vulnerability, no safe upgrade). It is a transitive
# dep of pdf-extract (lopdf), which fa-rules uses to read the text of PDF bills; the PDF text is
# extracted off the async runtime with a time limit. Revisit when pdf-extract/lopdf move to skrifa.
# (The zip ignores were removed on 2026-11-08: cargo-deny no longer detects them.)
ignore = ["RUSTSEC-2026-0441", "RUSTSEC-2026-0192"]

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "MPL-2.0",
    "Zlib",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "CC0-1.0",
    "AGPL-3.0-or-later",
    "0BSD",
    "BSL-1.0",
    "CDLA-Permissive-2.0",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
